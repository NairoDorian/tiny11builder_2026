# Tiny11 Builder - Ultimate Edition : continuous integration
#
# Everything runs in Windows PowerShell 5.1 (shell: powershell), the runtime
# the builders target. A real ISO build needs an ISO and admin rights, so CI
# covers what can be verified without them:
#   * parse + command resolution of every script
#   * ~1700 unit checks (catalog, presets, answer files, removal planning,
#     mocked build stages, static lint rules)
#   * generated files (docs, manifest, reference answer files) are up to date
#   * PSScriptAnalyzer (high-signal rules)
#   * the GUI window renders
#   * XML / JSON well-formedness

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell 5.1 checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse + command resolution
        shell: powershell
        run: .\scripts\parse-check.ps1

      - name: Unit tests
        shell: powershell
        run: .\scripts\test-core-helpers.ps1

      - name: Generated files are up to date
        shell: powershell
        run: .\scripts\update-generated.ps1 -Check

      - name: PSScriptAnalyzer
        shell: powershell
        run: .\scripts\linter.ps1

      - name: GUI renders
        shell: powershell
        run: |
          Import-Module .\lib\tiny11utils.psm1 -DisableNameChecking
          Import-Module .\lib\tiny11gui.psm1 -DisableNameChecking
          $png = Join-Path $env:RUNNER_TEMP 'gui.png'
          Show-Tiny11BuilderForm -Utilities (Get-OptionalUtilities) -PreviewPath $png `
            -IconPath .\resources\T11M_icon.ico -BannerPath .\resources\T11M_splash.png
          if (-not (Test-Path $png) -or (Get-Item $png).Length -lt 10KB) { throw 'GUI preview was not rendered.' }
          Write-Host "GUI rendered: $((Get-Item $png).Length) bytes"

      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-preview
          path: ${{ runner.temp }}/gui.png
          if-no-files-found: ignore

  data-files:
    name: XML / JSON well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Answer files
        run: |
          for f in autounattend.xml autounattend-arm64.xml; do python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$f" && echo "ok  $f"; done
      - name: Presets
        run: |
          for f in presets/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "ok  $f"; done
