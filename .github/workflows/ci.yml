# Tiny11 Builder Ultimate Edition — CI
# Validates PowerShell scripts, XML, and JSON on each push/PR.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  powershell-syntax:
    name: PowerShell Syntax Check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PowerShell
        uses: actions/setup-pwsh@v2

      - name: Install pwsh (fallback)
        if: runner.os == 'Windows'
        run: |
          choco install powershell-core -y || echo "Using built-in PowerShell 5.1"

      - name: Check PowerShell scripts syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Include *.ps1,*.psm1 -Recurse -Exclude "repos\**" | Where-Object { $_.FullName -notmatch '\\repos\\' }
          foreach ($script in $scripts) {
            Write-Host "Checking: $($script.FullName)"
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              Write-Error "$($script.Name) has $($errors.Count) parse error(s):"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "  OK: $($script.Name)"
          }

      - name: Run parse-check (function resolution)
        if: always()
        shell: pwsh
        run: |
          & .\scripts\parse-check.ps1

      - name: Run unit tests
        if: always()
        shell: pwsh
        run: |
          & .\scripts\test-core-helpers.ps1

  validate-xml:
    name: Validate XML files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate autoundate XML
        run: |
          for f in autounattend.xml autounattend-arm64.xml; do
            if [ -f "$f" ]; then
              echo "Validating: $f"
              xmllint --noout "$f" && echo "  OK: $f" || exit 1
            fi
          done

      - name: Validate preset JSON
        run: |
          for f in presets/default.json presets/gaming.json presets/minimal-vm.json presets/privacy-plus.json; do
            if [ -f "$f" ]; then
              echo "Validating: $f"
              python3 -c "import json; json.load(open('$f'))" && echo "  OK: $f" || exit 1
            fi
          done

      - name: Validate removePackage.txt
        run: |
          python3 -c "
          lines = open('removePackage.txt').read().strip().splitlines()
          pkgs = [l.strip() for l in lines if l.strip() and not l.startswith('#')]
          if len(pkgs) == 0:
              print('WARNING: removePackage.txt is empty')
          print(f'  OK: {len(pkgs)} packages defined')
          "
